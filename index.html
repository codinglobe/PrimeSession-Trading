<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PrimeSession Trading – Dashboard</title>
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/dashboard.css" />
</head>
<body>
  <main class="app-container dashboard">
    <header class="app-header">
      <div class="logo">🚀 PrimeSession Trading</div>
      <div class="header-right">
        <span class="badge" id="userLabel">👤</span>
        <button class="btn danger small hidden" id="logoutBtn">Logout</button>
      </div>
    </header>

    <div id="impersonationBanner" class="imp-banner hidden"></div>

    <nav class="nav nav-user">
      <a href="./index.html" class="active">Dashboard</a>
      <a href="./calculator.html">Rechner</a>
      <a href="./journal.html">Journal</a>
      <a href="./tickets.html">Tickets</a>
      <a href="./profile.html">Profil</a>
    </nav>

    <nav class="nav nav-admin hidden">
      <a href="./admin.html#dash">Dashboard</a>
      <a href="./admin.html#tickets">Tickets</a>
      <a href="./admin.html#users">Users</a>
    </nav>

    <section class="card">
      <h2>📊 Übersicht</h2>
      <div id="dashKpis" class="dash-kpis"></div>
    </section>

    <section class="grid cols-2" style="margin-top:1rem; align-items:start">
      <section class="card">
        <div class="cal-head">
          <h2>🗓️ Profit/Verlust – Kalender</h2>
          <div class="inline" style="gap:.5rem;flex-wrap:wrap">
            <button class="btn small" id="calPrev">◀</button>
            <div class="pill" id="calTitle">—</div>
            <button class="btn small" id="calNext">▶</button>
          </div>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </section>

      <section class="card">
        <h2>📅 Tagesliste</h2>
        <div id="dayList" class="day-list muted">—</div>
      </section>
    </section>

    <footer class="page-footer">
      <div class="impressum-title">Impressum</div>
      <div class="impressum-text">—</div>
    </footer>
  </main>

	<script src="./config.local.js"></script>
	<script src="./assets/js/config.js"></script>
  <script src="./assets/js/bootstrapConfig.js"></script>
	<script type="module" src="./assets/js/supabaseClient.js"></script>
  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/storage.js"></script>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/dashboard.js"></script>
</body>
</html>
